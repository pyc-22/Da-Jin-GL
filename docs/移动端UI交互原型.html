      var tb=$('tabbar');if(tb)tb.style.display=hideTab?'none':'flex';
      syncPrices();
      paintGold();
      paintTabs();
      bindScreen();
    }
    function paintTabs(){
      var tabs=document.querySelectorAll('.tab');
      for(var i=0;i<tabs.length;i++){(function(t){
        var active=(t.getAttribute('data-tab')===state.tab);
        t.style.color=active?'#A87F2C':'#A99B7E';
        t.style.fontWeight=active?'700':'400';
      })(tabs[i]);}
    }
    function syncPrices(){
      var sp=salePrice(),rp=recPrice(),dp=dpOf(state.rule);
      var e1=$('sSale');if(e1)e1.innerHTML=fmt(sp,dp)+'<span style="font-size:11px;color:#8A7B5E;font-weight:500;"> /克</span>';
      var e2=$('sRec');if(e2)e2.innerHTML=fmt(rp,dp)+'<span style="font-size:11px;color:#8A7B5E;font-weight:500;"> /克</span>';
      var e3=$('sSrc');if(e3)e3.textContent='基准 Au(T+D) '+fmt(state.base,2)+'（极速数据）｜ 加价 +'+fmt(state.markup,2)+' ｜ 扣减 −'+fmt(state.deduct,2)+(state.mode==='MANUAL'?' ｜ 当前手动定价':'');
      var e4=$('sGoldTitle');if(e4)e4.textContent=state.mode==='AUTO'?'今日金价（自动定价）':'今日金价（手动定价）';
    }
    function paintGold(){
      var seg=document.querySelectorAll('#modeSeg span');
      for(var i=0;i<seg.length;i++){(function(s){
        var on=s.getAttribute('data-mode')===state.mode;
        s.style.background=on?'linear-gradient(135deg,#C9A24B,#A87F2C)':'transparent';
        s.style.color=on?'#fff':'#9A8B6E';
      })(seg[i]);}
      var chips=document.querySelectorAll('#ruleChips span');
      for(var j=0;j<chips.length;j++){(function(c){
        var on=c.getAttribute('data-rule')===state.rule;
        c.style.background=on?'#A87F2C':'transparent';
        c.style.color=on?'#fff':'#8A7B5E';
        c.style.border=on?'1px solid #A87F2C':'1px solid #E7DCC6';
        c.style.fontWeight=on?'700':'400';
      })(chips[j]);}
      var mk=$('gMk');if(mk)mk.textContent='+'+fmt(state.markup,2);
      var dk=$('gDk');if(dk)dk.textContent='−'+fmt(state.deduct,2);
      var fm=$('fMk');if(fm)fm.textContent=fmt(state.markup,2);
      var fd=$('fDk');if(fd)fd.textContent=fmt(state.deduct,2);
      var fs=$('fSale');if(fs)fs.textContent='¥'+fmt(rawSale(),dpOf(state.rule))+'/克';
      var fr=$('fRec');if(fr)fr.textContent='¥'+fmt(rawRec(),dpOf(state.rule))+'/克';
      var warn=$('goldWarn');
      if(warn){var bad=rawSale()<=rawRec();warn.style.display=bad?'block':'none';}
      var ctrls=$('goldControls');
      if(ctrls)ctrls.style.pointerEvents=state.mode==='AUTO'?'auto':'none';
    }

    function openOrder(){
      state.locked={sale:salePrice(),rec:recPrice(),time:'11:00'};
      state.grams=28.6;state.oldG=5.2;state.guide=state.role==='manager'?0:0;
      state.tab='order';render();
    }
    function gridAction(g){
      if(g==='sale'){openOrder();return;}
      if(g==='gold'){if(state.role!=='manager'){toast('403：需要 gold:manage 权限，仅管理员可改金价');return;}state.tab='gold';render();return;}
      var map={proc:'加工开单',rec:'回收开单',member:'会员',stock:'库存',report:'报表',approval:'审批中心'};
      coming(map[g]||'功能');
    }

    function bindScreen(){
      var sc=$('screen');if(!sc)return;
      var backs=sc.querySelectorAll('[data-back]');for(var i=0;i<backs.length;i++){backs[i].onclick=function(){state.tab='home';render();};}
      var msgs=sc.querySelectorAll('[data-msg]');for(var a=0;a<msgs.length;a++){msgs[a].onclick=function(){state.tab='messages';render();};}
      var grids=sc.querySelectorAll('[data-grid]');for(var b=0;b<grids.length;b++){grids[b].onclick=function(){gridAction(this.getAttribute('data-grid'));};}
      var oo=sc.querySelectorAll('[data-openorder]');for(var c=0;c<oo.length;c++){oo[c].onclick=function(){openOrder();};}
      var tips=sc.querySelectorAll('[data-toast]');for(var d=0;d<tips.length;d++){tips[d].onclick=function(){toast('「'+this.getAttribute('data-toast')+'」原型暂未包含');};}
      var me=sc.querySelectorAll('[data-me]');for(var e=0;e<me.length;e++){me[e].onclick=function(){
        var act=this.getAttribute('data-me');
        if(act==='gold'){if(state.role!=='manager'){toast('403：需要 gold:manage 权限');return;}state.tab='gold';render();}
        else if(act.indexOf('toast:')===0){coming(act.substring(6));}
      };}
      var gl=sc.querySelectorAll('[data-goldlog]');for(var f2=0;f2<gl.length;f2++){gl[f2].onclick=function(){coming('价格变更日志');};}
      var ng=sc.querySelectorAll('[data-nextguide]');for(var g2=0;g2<ng.length;g2++){ng[g2].onclick=function(){state.guide=(state.guide+1)%3;this.textContent='导购：'+guides[state.guide]+' ▾';if(state.guide===2)toast('本单无导购，将不计销售提成');};}
      var nm=sc.querySelectorAll('[data-nextmember]');for(var h2=0;h2<nm.length;h2++){nm[h2].onclick=function(){state.member=(state.member+1)%2;this.textContent=members[state.member]+' ▾';};}
      var gst=sc.querySelectorAll('[data-gstep]');for(var k=0;k<gst.length;k++){gst[k].onclick=function(){state.grams=Math.max(0.1,Math.round((state.grams+parseFloat(this.getAttribute('data-gstep'))*0.1)*10)/10);render();};}
      var ost=sc.querySelectorAll('[data-ostep]');for(var l=0;l<ost.length;l++){ost[l].onclick=function(){state.oldG=Math.max(0,Math.round((state.oldG+parseFloat(this.getAttribute('data-ostep'))*0.1)*10)/10);render();};}
      var submit=$('submitOrder');if(submit)submit.onclick=function(){
        if(state.guide===2){toast('已提交（无导购，不计提成），金价已锁定');}else{toast('订单已提交，金价与加价已快照锁定');}
        setTimeout(function(){state.tab='home';render();},900);
      };
      var modes=sc.querySelectorAll('#modeSeg span');for(var m=0;m<modes.length;m++){modes[m].onclick=function(){state.mode=this.getAttribute('data-mode');paintGold();toast(state.mode==='AUTO'?'已切到自动定价（随行情联动）':'已切到手动定价（行情变动不重算）');};}
      var mks=sc.querySelectorAll('[data-mk]');for(var n=0;n<mks.length;n++){mks[n].onclick=function(){state.markup=Math.max(0,Math.round((state.markup+parseFloat(this.getAttribute('data-mk')))*100)/100);paintGold();};}
      var dks=sc.querySelectorAll('[data-dk]');for(var p=0;p<dks.length;p++){dks[p].onclick=function(){state.deduct=Math.max(0,Math.round((state.deduct+parseFloat(this.getAttribute('data-dk')))*100)/100);paintGold();};}
      var rules=sc.querySelectorAll('#ruleChips span');for(var q=0;q<rules.length;q++){rules[q].onclick=function(){state.rule=this.getAttribute('data-rule');paintGold();};}
      var save=$('saveGold');if(save)save.onclick=function(){
        if(rawSale()<=rawRec()){toast('卖价 ≤ 回收价，已拦截保存');return;}
        if(state.mode==='MANUAL'){toast('手动模式：配置已记录，价格保持不变');}
        toast('已保存，全端 30 秒内同步生效');
        setTimeout(function(){state.tab='home';render();},1000);
      };
    }

    /* 外层固定控件 */
    var rm=$('roleManager'),rs=$('roleSales');
    function paintRole(){
      if(!rm||!rs)return;
      var gold='linear-gradient(135deg,#C9A24B,#A87F2C)';
      rm.style.background=state.role==='manager'?gold:'#F3ECDB';rm.style.color=state.role==='manager'?'#fff':'#8A7B5E';
      rs.style.background=state.role==='sales'?gold:'#F3ECDB';rs.style.color=state.role==='sales'?'#fff':'#8A7B5E';
    }
    rm.onclick=function(){state.role='manager';state.tab='home';paintRole();render();};
    rs.onclick=function(){state.role='sales';state.tab='home';paintRole();render();};
    var tabs=document.querySelectorAll('.tab');
    for(var i=0;i<tabs.length;i++){tabs[i].onclick=function(){state.tab=this.getAttribute('data-tab');render();};}
    $('centerBtn').onclick=function(){openOrder();};

    paintRole();
    render();
  }catch(e){if(window&&window.console)console.error('prototype error:',e);var s=document.getElementById('screen');if(s)s.innerHTML='<div style="padding:30px;font-size:13px;color:#C0453B;">原型脚本出错，请刷新页面重试。</div>';}
})();
</script>
</div>
</html>
