<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>锤与金条 · 精修矢量版</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#EFE7D8; font-family:'PingFang SC','Microsoft YaHei',sans-serif; color:#221C14; padding:30px 20px 50px; }
  .wrap { max-width:1100px; margin:0 auto; }
  h1 { font-size:22px; }
  .sub { font-size:13px; color:#7A6D58; margin:6px 0 22px; }
  .row { display:flex; gap:26px; flex-wrap:wrap; }
  .card { background:#fff; border:1px solid #E7DCC6; border-radius:18px; padding:22px; flex:1; min-width:300px; }
  .tag { display:inline-block; font-size:12px; font-weight:700; color:#A87F2C; background:#F6EDD7; border-radius:999px; padding:4px 12px; margin-bottom:12px; }
  .name { font-size:16px; font-weight:800; margin-bottom:4px; }
  .desc { font-size:12px; color:#7A6D58; line-height:1.7; margin-bottom:16px; }
  .stage { display:flex; align-items:flex-end; gap:22px; background:#F6F1E7; border-radius:14px; padding:20px; }
  .size-demo { text-align:center; }
  .size-demo small { display:block; font-size:10px; color:#9A8B6E; margin-top:8px; }
  .icon { border-radius:24%; overflow:hidden; }
  .gold-bg { background:linear-gradient(160deg,#E2C87B 0%,#C9A24B 40%,#A87F2C 100%); }
  .deep-bg { background:linear-gradient(160deg,#D8B463 0%,#B0832E 100%); }
</style>
</head>
<body>
<div class="wrap">
  <h1>锤与金条 · 精修矢量版（第三轮）</h1>
  <div class="sub">保留"打金锤+金条"方向，重画三版精修矢量 ｜ 192 / 96 / 48px 三档</div>

  <div class="row">
    <!-- A 精修扁平 -->
    <div class="card">
      <span class="tag">A · 精修扁平（推荐）</span>
      <div class="name">木柄金锤 敲 金条</div>
      <div class="desc">锤头双色立体、柄带收尾，金条带顶面高光，敲击点加两粒小火花，动作感强。</div>
      <div class="stage">
        <div class="size-demo">
          <div class="icon gold-bg" style="width:192px;height:192px;">
            <svg viewBox="0 0 100 100" width="100%" height="100%">
              <defs>
                <linearGradient id="barA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E2C87B"/><stop offset="1" stop-color="#B0832E"/></linearGradient>
              </defs>
              <path d="M20 74 L80 74 L73 87 L27 87 Z" fill="url(#barA)"/>
              <path d="M20 74 L80 74 L77 68 L23 68 Z" fill="#F5E4AE"/>
              <g transform="rotate(-45 48 40)">
                <rect x="44" y="6" width="9" height="40" rx="4.5" fill="#8F6517"/>
                <rect x="44" y="6" width="9" height="40" rx="4.5" fill="none"/>
                <rect x="27" y="10" width="43" height="17" rx="6" fill="#3A2F1C"/>
                <rect x="27" y="10" width="43" height="8.5" rx="4.2" fill="#5C4A2E"/>
              </g>
              <circle cx="30" cy="58" r="2.6" fill="#FFFDF5"/>
              <circle cx="23" cy="52" r="1.8" fill="#FFF3CE"/>
              <circle cx="35" cy="50" r="1.5" fill="#FFF3CE"/>
            </svg>
          </div><small>192px</small>
        </div>
        <div class="size-demo">
          <div class="icon gold-bg" style="width:96px;height:96px;">
            <svg viewBox="0 0 100 100" width="100%" height="100%">
              <defs><linearGradient id="barA2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E2C87B"/><stop offset="1" stop-color="#B0832E"/></linearGradient></defs>
              <path d="M20 74 L80 74 L73 87 L27 87 Z" fill="url(#barA2)"/>
              <path d="M20 74 L80 74 L77 68 L23 68 Z" fill="#F5E4AE"/>
              <g transform="rotate(-45 48 40)">
                <rect x="44" y="6" width="9" height="40" rx="4.5" fill="#8F6517"/>
                <rect x="27" y="10" width="43" height="17" rx="6" fill="#3A2F1C"/>
                <rect x="27" y="10" width="43" height="8.5" rx="4.2" fill="#5C4A2E"/>
              </g>
              <circle cx="30" cy="58" r="2.6" fill="#FFFDF5"/>
              <circle cx="23" cy="52" r="1.8" fill="#FFF3CE"/>
            </svg>
          </div><small>96px</small>
        </div>
        <div class="size-demo">
          <div class="icon gold-bg" style="width:48px;height:48px;">
            <svg viewBox="0 0 100 100" width="100%" height="100%">
              <path d="M20 74 L80 74 L73 87 L27 87 Z" fill="#C9A24B"/>
              <g transform="rotate(-45 48 40)">
                <rect x="44" y="6" width="9" height="40" rx="4.5" fill="#8F6517"/>
                <rect x="27" y="10" width="43" height="17" rx="6" fill="#3A2F1C"/>
              </g>
              <circle cx="30" cy="58" r="3" fill="#FFFDF5"/>
            </svg>
          </div><small>48px</small>
        </div>
      </div>
    </div>

    <!-- B 厚重圆润 -->
    <div class="card">
      <span class="tag">B · 厚重圆润</span>
      <div class="name">大锤头 · 强对比</div>
      <div class="desc">锤头加大加圆、深棕底换浅金底，形状更"憨"更亲和不精细，小图标下轮廓最结实。</div>
      <div class="stage">
        <div class="size-demo">
          <div class="icon deep-bg" style="width:192px;height:192px;">
            <svg viewBox="0 0 100 100" width="100%" height="100%">
              <defs><linearGradient id="barB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F5E4AE"/><stop offset="1" stop-color="#C9A24B"/></linearGradient></defs>
              <path d="M18 72 L82 72 L74 88 L26 88 Z" fill="url(#barB)"/>
              <ellipse cx="50" cy="72" rx="32" ry="4" fill="#8F6517" opacity=".45"/>
              <g transform="rotate(-38 52 38)">
                <rect x="47" y="2" width="10" height="46" rx="5" fill="#6B4E1F"/>
                <rect x="24" y="8" width="52" height="24" rx="12" fill="#2E2415"/>
                <rect x="30" y="12" width="18" height="16" rx="9" fill="#4A3A22"/>
              </g>
              <circle cx="28" cy="60" r="3.2" fill="#FFFDF5"/>
              <circle cx="21" cy="54" r="2" fill="#FFF3CE"/>
            </svg>
          </div><small>192px</small>
        </div>
        <div class="size-demo">
          <div class="icon deep-bg" style="width:96px;height:96px;">
            <svg viewBox="0 0 100 100" width="100%" height="100%">
              <defs><linearGradient id="barB2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F5E4AE"/><stop offset="1" stop-color="#C9A24B"/></linearGradient></defs>
              <path d="M18 72 L82 72 L74 88 L26 88 Z" fill="url(#barB2)"/>
              <g transform="rotate(-38 52 38)">
                <rect x="47" y="2" width="10" height="46" rx="5" fill="#6B4E1F"/>
                <rect x="24" y="8" width="52" height="24" rx="12" fill="#2E2415"/>
              </g>
              <circle cx="28" cy="60" r="3.2" fill="#FFFDF5"/>
            </svg>
          </div><small>96px</small>
        </div>
        <div class="size-demo">
          <div class="icon deep-bg" style="width:48px;height:48px;">
            <svg viewBox="0 0 100 100" width="100%" height="100%">
              <path d="M18 72 L82 72 L74 88 L26 88 Z" fill="#F0DCA0"/>
              <g transform="rotate(-38 52 38)">
                <rect x="47" y="2" width="10" height="46" rx="5" fill="#6B4E1F"/>
                <rect x="24" y="8" width="52" height="24" rx="12" fill="#2E2415"/>
              </g>
            </svg>
          </div><small>48px</small>
        </div>
      </div>
    </div>

    <!-- C 线稿 -->
    <div class="card">
      <span class="tag">C · 单色线稿</span>
      <div class="name">墨棕线描 锤与金条</div>
      <div class="desc">暖金底上用墨棕粗线勾出锤与金条，最像"老字号"商标，风格最持久。</div>
      <div class="stage">
        <div class="size-demo">
          <div class="icon gold-bg" style="width:192px;height:192px;">
            <svg viewBox="0 0 100 100" width="100%" height="100%" fill="none" stroke="#2E2415" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
              <g transform="rotate(-45 48 38)">
                <rect x="45" y="4" width="8" height="38" rx="4"/>
                <rect x="28" y="9" width="42" height="18" rx="6" fill="#2E2415" stroke-width="5"/>
              </g>
              <path d="M22 72 L78 72 L71 86 L29 86 Z"/>
              <path d="M30 72 L71 72" stroke-width="4" opacity=".5"/>
            </svg>
          </div><small>192px</small>
        </div>
        <div class="size-demo">
          <div class="icon gold-bg" style="width:96px;height:96px;">
            <svg viewBox="0 0 100 100" width="100%" height="100%" fill="none" stroke="#2E2415" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
              <g transform="rotate(-45 48 38)">
                <rect x="45" y="4" width="8" height="38" rx="4"/>
                <rect x="28" y="9" width="42" height="18" rx="6" fill="#2E2415" stroke-width="5"/>
              </g>
              <path d="M22 72 L78 72 L71 86 L29 86 Z"/>
            </svg>
          </div><small>96px</small>
        </div>
        <div class="size-demo">
          <div class="icon gold-bg" style="width:48px;height:48px;">
            <svg viewBox="0 0 100 100" width="100%" height="100%" fill="none" stroke="#2E2415" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
              <g transform="rotate(-45 48 38)">
                <rect x="45" y="4" width="8" height="38" rx="4"/>
                <rect x="28" y="9" width="42" height="18" rx="6" fill="#2E2415" stroke-width="4"/>
              </g>
              <path d="M22 72 L78 72 L71 86 L29 86 Z"/>
            </svg>
          </div><small>48px</small>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
