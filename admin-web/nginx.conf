server {
  listen 80;
  server_name _;
  client_max_body_size 10m;
  location = /actuator/health {
    proxy_pass http://backend:8080/actuator/health;
    proxy_set_header Host $host;
  }
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  location /ws {
    proxy_pass http://backend:8080/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }
  location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /uploads/ { proxy_pass http://backend:8080/uploads/; proxy_set_header Host $host; }
  location = /swagger-ui.html { proxy_pass http://backend:8080/swagger-ui.html; proxy_set_header Host $host; }
  location /swagger-ui/ { proxy_pass http://backend:8080/swagger-ui/; proxy_set_header Host $host; }
  location /v3/api-docs/ { proxy_pass http://backend:8080/v3/api-docs/; proxy_set_header Host $host; }
  location /swagger-resources/ { proxy_pass http://backend:8080/swagger-resources/; proxy_set_header Host $host; }
  location /webjars/ { proxy_pass http://backend:8080/webjars/; proxy_set_header Host $host; }
  location / { try_files $uri $uri/ /index.html; }
}
