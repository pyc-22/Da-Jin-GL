name: Release and deploy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    name: Verify release build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test and package backend
        run: mvn -B -pl backend test package

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: |
            admin-web/pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Build admin web
        working-directory: admin-web
        run: pnpm install --frozen-lockfile && pnpm test && pnpm run build

      - name: Build mobile web
        working-directory: mobile
        run: pnpm install --frozen-lockfile && pnpm test && pnpm run build:h5

      - name: Validate Compose configuration
        run: docker compose --env-file .env.production.example -f docker-compose.release.yml config --quiet

  docker-build:
    name: Build release Docker images
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose --env-file .env.production.example -f docker-compose.release.yml build backend admin-web mobile-web

  cashier:
    name: Build Windows cashier installer
    runs-on: windows-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: front-pc/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: front-pc
        run: pnpm install --frozen-lockfile

      - name: Test and package installer
        working-directory: front-pc
        run: pnpm test && pnpm run dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: cashier-installer
          path: front-pc/release/**/*.exe
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [docker-build, cashier]
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: cashier-installer
          path: release-assets

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          installer="$(find release-assets -type f -name '*.exe' -print -quit)"
          test -n "$installer"
          sha256sum "$installer" > release-assets/SHA256SUMS.txt
          cat > release-assets/DEPLOY.txt <<EOF
          Da-Jin-GL ${GITHUB_REF_NAME}

          Server deployment:
            git fetch --tags origin
            git checkout --detach ${GITHUB_REF_NAME}
            docker compose -f docker-compose.release.yml up -d --build
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          installer="$(find release-assets -type f -name '*.exe' -print -quit)"
          gh release create "$GITHUB_REF_NAME" \
            "$installer" \
            release-assets/SHA256SUMS.txt \
            release-assets/DEPLOY.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Da-Jin-GL $GITHUB_REF_NAME" \
            --generate-notes

  deploy:
    name: Deploy to production server
    runs-on: ubuntu-latest
    needs: github-release
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    environment: production
    steps:
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configure SSH host key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          if [ -n "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          fi

      - name: Deploy tagged release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH=$(printf '%q' "$DEPLOY_PATH") RELEASE_TAG=$(printf '%q' "$RELEASE_TAG") REPOSITORY=$(printf '%q' "$REPOSITORY") bash -s" <<'REMOTE'
          set -euo pipefail
          if [ ! -d "$DEPLOY_PATH/.git" ]; then
            mkdir -p "$(dirname "$DEPLOY_PATH")"
            git clone "$REPOSITORY" "$DEPLOY_PATH"
          fi
          cd "$DEPLOY_PATH"
          git fetch --prune origin --tags
          git checkout --detach "$RELEASE_TAG"
          test -f .env
          compose_files=(-f docker-compose.release.yml)
          if [ -f docker-compose.override.yml ]; then
            compose_files+=(-f docker-compose.override.yml)
          fi
          docker compose "${compose_files[@]}" config -q
          docker compose "${compose_files[@]}" up -d --build
          docker compose "${compose_files[@]}" ps
          curl -fsS http://127.0.0.1:8080/actuator/health
          REMOTE
