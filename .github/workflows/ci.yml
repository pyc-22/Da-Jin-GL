name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test and package backend
        run: mvn -B -pl backend test package

  web:
    name: ${{ matrix.name }} tests and build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Admin web
            directory: admin-web
            build-command: pnpm run build
          - name: Mobile web
            directory: mobile
            build-command: pnpm run build:h5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ${{ matrix.directory }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: ${{ matrix.directory }}
        run: pnpm test

      - name: Build web app
        working-directory: ${{ matrix.directory }}
        run: ${{ matrix.build-command }}

  cashier:
    name: Cashier tests and Windows package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: front-pc/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: front-pc
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: front-pc
        run: pnpm test

      - name: Build installer on main
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
        working-directory: front-pc
        run: pnpm run dist

      - name: Build cashier web assets for pull requests
        if: ${{ github.event_name == 'pull_request' }}
        working-directory: front-pc
        run: pnpm run build

      - name: Upload installer
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: cashier-installer-${{ github.sha }}
          path: front-pc/release/**/*.exe
          if-no-files-found: error
          retention-days: 14

  deployment-config:
    name: Validate deployment configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose --env-file .env.production.example -f docker-compose.release.yml config --quiet

      - name: Validate deployment files
        run: python3 scripts/test-deployment-config.py
