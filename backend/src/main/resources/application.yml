server:
  port: 8080
  address: 0.0.0.0
  tomcat:
    max-swallow-size: 10MB
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:dajin-assets}
app:
  cors-origins: ${MINIO_CORS_ORIGINS:http://localhost,http://127.0.0.1,http://localhost:81,http://127.0.0.1:81,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,http://127.0.0.1:5176}
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  application:
    name: dajin-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dajin?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:dajin}
    password: ${DB_PASSWORD:dajin}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    default-property-inclusion: non_null
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
  sql:
    init:
      mode: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      group:
        local-core:
          include: db
dajin:
  jwt-secret: ${JWT_SECRET:change-me-in-production-please-32-bytes}
  jwt-hours: ${JWT_HOURS:2}
